<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>DSH Mobile</title>
  <meta name="description" content="Remote control for DeepSeek Harness — sessions, streaming, approvals. Foldable-first PWA.">
  <meta name="theme-color" content="#0b0e14" id="meta-theme-color">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DSH Mobile">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <a class="skip-link" href="#pane-list" data-i18n="a11y.skipToSessions">К списку сессий</a>

  <div id="app" class="app" data-view="list" data-route="sessions" data-stream="idle">
    <main id="panes" class="panes">
      <section id="pane-list" class="pane pane-list" aria-label="Сессии" tabindex="-1"></section>
      <section id="pane-chat" class="pane pane-chat" aria-label="Диалог" tabindex="-1"></section>
    </main>

    <div id="overlay" class="overlay" hidden></div>
    <div id="sheets" class="sheets"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
    <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <div id="lab-bar" class="lab-bar" hidden></div>

  <noscript>
    <div class="noscript">Для работы DSH Mobile нужен JavaScript.</div>
  </noscript>

  <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">

      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.2 12a8.2 8.2 0 1 1-2.4-5.8"/><path d="M20.4 4.2v5.2h-5.2"/></symbol>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
